<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory moves</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    
</head>
<body>
    <main class = "main">
        <h1><i class="fa-solid fa-home"></i>Memory Moves<i class="fa-solid fa-home"></i></h1>
        <div id="stats" aria-live="polite">
            <p class = "stat">Moves: <span id="moves">0</span></p>
            <p class = "stat">Best Score:<span id="best">-</span></p>
        </div>
        <div id ="board" aria-label="Memory move board"></div>    
        <p id="message" aria-live="polite"></p>
        <button id="restart" type="button"><i class="fas fa-redo"></i> New Game</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
